<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Ratchet and bit parts">
  <title>Ratchet, exploded</title>

  <!-- ratchet ring: teeth, wall, spokes -->
  <circle cx="300" cy="230" r="196" fill="none" stroke="#f4efe3" stroke-width="34"
          stroke-dasharray="14 30"/>
  <circle cx="300" cy="230" r="172" fill="none" stroke="#f4efe3" stroke-width="8"/>
  <circle cx="300" cy="230" r="86" fill="none" stroke="#e11021" stroke-width="16"/>
  <g stroke="#f4efe3" stroke-width="10" stroke-linecap="round">
    <path d="M300,144 L300,58"/>
    <path d="M374,273 L449,316"/>
    <path d="M226,273 L151,316"/>
  </g>

  <!-- height callout, ratchet style -->
  <g stroke="#e11021" stroke-width="7" fill="none">
    <path d="M486,196 L486,470"/>
    <path d="M470,196 L502,196"/>
    <path d="M470,470 L502,470"/>
  </g>

  <!-- bit: shaft and tip -->
  <path d="M262,414 L338,414 L338,470 L318,470 L318,506 L282,506 L282,470 L262,470 Z"
        fill="#e11021" stroke="#f4efe3" stroke-width="8"/>
  <circle cx="300" cy="546" r="42" fill="none" stroke="#f4efe3" stroke-width="14"/>

  <!-- assembly guides -->
  <g stroke="#f4efe3" stroke-width="5" stroke-dasharray="12 14" opacity="0.75">
    <path d="M300,326 L300,404"/>
    <path d="M300,516 L300,592"/>
  </g>
</svg>
